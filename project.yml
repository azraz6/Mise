name: Mise
options:
  bundleIdPrefix: com.elahitech
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: W39964D5QG
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Mise:
    type: application
    platform: iOS
    sources:
      - path: Mise
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elahitech.mise
        PRODUCT_NAME: Mise
        INFOPLIST_FILE: Mise/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mise/Resources/Mise.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - target: MiseShare
        embed: true
        codeSign: true
      - sdk: StoreKit.framework
      - sdk: Vision.framework
  MiseShare:
    type: app-extension
    platform: iOS
    sources:
      - path: MiseShare
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elahitech.mise.share
        PRODUCT_NAME: Mise Share
        INFOPLIST_FILE: MiseShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: MiseShare/MiseShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  MiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MiseTests
      - path: Mise/Resources/Products.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elahitech.mise.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mise.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Mise"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Mise
  MiseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MiseUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elahitech.mise.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mise
    dependencies:
      - target: Mise
schemes:
  Mise:
    build:
      targets:
        Mise: all
        MiseTests: [test]
        MiseUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Mise/Resources/Products.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MiseTests
        - MiseUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
